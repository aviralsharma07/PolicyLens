[project]
name = "PolicyLens"
version = "0.1.0"
description = "Evidence-linked document intelligence engine for Indian health insurance policy documents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aviral Sharma" },
]
keywords = [
    "document-intelligence",
    "pdf-parsing",
    "insurance",
    "information-extraction",
    "document-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/aviralsharma07/PolicyLens"
Repository = "https://github.com/aviralsharma07/PolicyLens"
Issues = "https://github.com/aviralsharma07/PolicyLens/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: integration tests that read generated parser outputs",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
